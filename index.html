<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Poké Vendor — Rip · Grade · Sell</title>
    <meta name="theme-color" content="#0c0f1a" />
    <meta name="description" content="A Pokémon card vendor sim: rip packs, price hits, grade gems, work shows, sell for profit." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- Card images live on these CDNs — warm DNS+TLS early so the first card isn't
         stuck behind a cold connection handshake. (These are the hosts actually used in
         the snapshot; the old tcggo/tcgplayer-cdn hints pointed at hosts we never hit.)
         NO crossorigin here: card art loads via plain <img> (no-cors), and browsers only
         reuse a preconnected socket when the credential mode matches — a crossorigin
         preconnect would warm a CORS socket the images can never use. -->
    <link rel="preconnect" href="https://images.pokemontcg.io" />
    <link rel="dns-prefetch" href="https://images.pokemontcg.io" />
    <link rel="preconnect" href="https://images.scrydex.com" />
    <link rel="dns-prefetch" href="https://images.scrydex.com" />
    <!-- No home-screen / PWA meta here on purpose: this bundle is served inside the native
         iOS shell over a custom URL scheme (ios/Sources/Shell.swift), which supplies the app
         icon, title and status-bar style itself. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
