<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2340"/>
      <stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5e6c"/>
      <stop offset="0.25" stop-color="#ffcb05"/>
      <stop offset="0.5" stop-color="#36d399"/>
      <stop offset="0.75" stop-color="#3b6cff"/>
      <stop offset="1" stop-color="#ff3df0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- back card (tilted) -->
  <g transform="rotate(-12 256 256)">
    <rect x="150" y="120" width="212" height="296" rx="20" fill="#2a3252" stroke="#3b6cff" stroke-width="4"/>
  </g>
  <!-- front holo card -->
  <g transform="rotate(8 256 256)">
    <rect x="156" y="116" width="200" height="280" rx="20" fill="url(#holo)"/>
    <rect x="156" y="116" width="200" height="280" rx="20" fill="#000" opacity="0.12"/>
    <!-- shine streak -->
    <rect x="156" y="116" width="200" height="280" rx="20" fill="#ffffff" opacity="0.0"/>
    <polygon points="200,116 250,116 150,396 100,396" fill="#ffffff" opacity="0.22"/>
    <!-- poké-ball emblem -->
    <circle cx="256" cy="256" r="58" fill="#fff"/>
    <path d="M198 256 a58 58 0 0 1 116 0 z" fill="#ff3b3b"/>
    <rect x="198" y="250" width="116" height="12" fill="#1a1a1a"/>
    <circle cx="256" cy="256" r="20" fill="#fff" stroke="#1a1a1a" stroke-width="8"/>
  </g>
</svg>
