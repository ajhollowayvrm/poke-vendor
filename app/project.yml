name: PokeVendor
options:
  bundleIdPrefix: com.ajholloway
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PokeVendor:
    type: application
    platform: iOS
    sources:
      - path: PokeVendor
    info:
      path: PokeVendor/Info.plist
      properties:
        CFBundleDisplayName: PokeVendor
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajholloway.pokevendor
        DEVELOPMENT_TEAM: 2BY68WLT6R
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
